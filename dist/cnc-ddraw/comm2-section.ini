; ===== Commandos2-ModernPatch: Commandos 2 (Comm2.exe) =====
; Borderless fullscreen without display mode switches (no black screens when
; the game changes resolution for menus/cutscenes). Aspect ratio is preserved.
[comm2]
windowed=true
fullscreen=true
border=false
maintas=true
boxing=false
adjmouse=true
renderer=auto
shader=Shaders\interpolation\catmull-rom-bilinear.glsl
d3d9_filter=2
maxfps=-1
vsync=false
; Commandos2-ModernPatch does its own frame pacing
maxgameticks=-1
minfps=0
singlecpu=false
resolutions=2
savesettings=0
nonexclusive=true
