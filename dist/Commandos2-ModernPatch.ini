[Commandos2-ModernPatch]
; 1 = mod enabled, 0 = the game runs exactly like the original (F10 toggles in game)
Enabled=1

; Smooth camera scrolling and zoom
Camera=1

; Smooth movement of soldiers, vehicles and projectiles (F11 toggles in game)
Objects=1

; Smooth arrow cursor and inventory dragging
Mouse=1

; Smooth cursor in menus and the pause menu
Menus=1

; Resolution used for the game's "1280x720 (16:9)" video mode
; (pick that mode in the game's video options)
HDResolution=1920x1080

; Pause menu in the game resolution with a sharp game view behind it
HDMenus=1

; Pause menu size: 1 = stretched to full screen, 2 = enlarged keeping 4:3, 0 = small, centred
PauseMenuScale=1

; 1 = borderless full screen through the bundled cnc-ddraw (no black screens on resolution changes)
; 0 = system DirectDraw (exclusive full screen, like the original)
CncDDraw=1

; Cheat keys (Ctrl+I, Ctrl+V, Shift+X, Ctrl+Shift+N, ...) without typing the password.
; With 0 they are enabled by typing PYROFOREVER or GONZOANDJON during a mission.
Cheats=0

; Frame rate cap, 0 = monitor refresh rate
MaxFps=0

; 1 = statistics in Commandos2-ModernPatch.log
; 2 = + memory diagnostics (causes stutter, for development only)
Debug=0
